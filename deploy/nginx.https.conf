# Replace srs.example.com and certificate paths, then run nginx -t before enabling.
# Docker upstream ports are loopback-only; expose only this TLS edge publicly.
server {
    listen 80;
    server_name srs.example.com;
    return 301 https://srs.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name srs.example.com;
    ssl_certificate /etc/letsencrypt/live/srs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard client-supplied forwarding claims at the public edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
