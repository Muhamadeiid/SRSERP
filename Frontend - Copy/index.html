<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotem SRS Egypt</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fafafa; }
      .srs-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fafafa;
        font-family: Arial, sans-serif;
      }
      .srs-boot-content { text-align: center; }
      .srs-boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border: 3px solid #dbe4ea;
        border-top-color: #005782;
        border-radius: 50%;
        animation: srs-boot-spin .75s linear infinite;
      }
      .srs-boot-label {
        margin-top: 16px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      @keyframes srs-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="srs-boot-loader" aria-label="Loading">
        <div class="srs-boot-content">
          <div class="srs-boot-spinner" aria-hidden="true"></div>
          <div class="srs-boot-label">Loading...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
